<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solo — LinkedIn ou Interpol ?</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #0a0a0a;
      --white: #f5f2eb;
      --red: #e63329;
      --blue: #0a66c2;
      --gray: #b0aa9e;
      --card-bg: #131310;
      --border: rgba(255,255,255,0.08);
      --green: #22c55e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black); color: var(--white);
      font-family: 'Syne', sans-serif; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* NAV */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2.5rem;
      border-bottom: 0.5px solid var(--border);
      position: sticky; top: 0; z-index: 10;
      background: rgba(10,10,10,0.9); backdrop-filter: blur(12px);
    }
    .nav-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: var(--white); }
    .nav-logo span.li { color: var(--blue); }
    .nav-logo span.int { color: var(--red); }
    .nav-back { font-size: 12px; color: var(--gray); text-decoration: none; letter-spacing: 0.06em; transition: color 0.2s; }
    .nav-back:hover { color: var(--white); }

    /* SCORE BAR */
    .scorebar {
      display: flex; align-items: center; justify-content: center; gap: 2rem;
      padding: 1rem 2rem;
      border-bottom: 0.5px solid var(--border);
      background: var(--card-bg);
      flex-wrap: wrap;
    }
    .score-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .score-val { font-size: 22px; font-weight: 800; font-family: 'DM Mono', monospace; }
    .score-lbl { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); }
    .score-item.correct .score-val { color: var(--green); }
    .score-item.incorrect .score-val { color: var(--red); }
    .score-item.total .score-val { color: var(--white); }
    .score-sep { width: 1px; height: 32px; background: var(--border); }

    /* MAIN */
    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 2.5rem 1.5rem;
      gap: 2rem;
    }

    /* COMPTEUR QUESTION */
    .question-counter {
      font-family: 'DM Mono', monospace; font-size: 11px;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray);
    }

    /* CARTE PHOTO */
    .photo-card {
      width: 100%; max-width: 380px;
      border: 0.5px solid var(--border);
      border-radius: 8px; overflow: hidden;
      position: relative;
      transition: border-color 0.3s;
    }
    .photo-card.reveal-correct { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
    .photo-card.reveal-linkedin { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
    .photo-card.reveal-interpol { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }

    .photo-frame {
      width: 100%; aspect-ratio: 3/4;
      background: #1a1a17;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .photo-frame img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .photo-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      color: var(--gray);
    }
    .photo-placeholder .icon { font-size: 4rem; opacity: 0.3; }
    .photo-placeholder p { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.4; }

    /* OVERLAY RÉSULTAT */
    .result-overlay {
      display: none;
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 1.25rem;
      background: rgba(10,10,10,0.97);
      border-top: 0.5px solid var(--border);
    }
    .result-overlay.show { display: block; animation: slideUp 0.3s ease; }

    @keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .result-verdict {
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      font-family: 'DM Mono', monospace; margin-bottom: 0.4rem;
    }
    .result-verdict.correct { color: var(--green); }
    .result-verdict.incorrect { color: var(--red); }

    .result-name { font-size: 17px; font-weight: 800; margin-bottom: 0.25rem; }
    .result-name.linkedin { color: var(--blue); }
    .result-name.interpol { color: var(--red); }

    .result-desc {
      font-size: 12px; color: var(--gray); line-height: 1.55;
      margin-bottom: 0.85rem;
    }

    .result-link {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; text-decoration: none;
      padding: 0.45rem 1rem; border-radius: 2px;
      transition: opacity 0.2s;
    }
    .result-link:hover { opacity: 0.75; }
    .result-link.linkedin { background: var(--blue); color: #fff; }
    .result-link.interpol { background: var(--red); color: #fff; }
    .result-link .ext { font-size: 13px; }

    /* BOUTONS VOTE */
    .vote-buttons {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem; width: 100%; max-width: 380px;
    }
    .vote-btn {
      padding: 1rem; border-radius: 4px; border: none;
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800;
      letter-spacing: 0.04em; cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .vote-btn:hover { transform: translateY(-2px); }
    .vote-btn:active { transform: scale(0.97); }
    .vote-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .vote-btn .btn-icon { font-size: 1.6rem; }
    .vote-btn.linkedin { background: var(--blue); color: #fff; }
    .vote-btn.interpol { background: var(--red); color: #fff; }

    /* BOUTON SUIVANT */
    .next-btn {
      display: none; width: 100%; max-width: 380px;
      padding: 1rem; border-radius: 4px;
      background: rgba(255,255,255,0.06); border: 0.5px solid var(--border);
      color: var(--white); font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 700; letter-spacing: 0.08em;
      cursor: pointer; transition: background 0.2s;
    }
    .next-btn.show { display: block; animation: fadeUp 0.3s ease; }
    .next-btn:hover { background: rgba(255,255,255,0.1); }

    /* ÉCRAN FIN */
    .end-screen {
      display: none; flex-direction: column; align-items: center;
      text-align: center; gap: 1.5rem; padding: 2rem;
    }
    .end-screen.show { display: flex; animation: fadeUp 0.4s ease; }
    .end-title { font-size: clamp(2rem, 8vw, 4rem); font-weight: 800; line-height: 1; }
    .end-score { font-family: 'DM Mono', monospace; font-size: 1.2rem; color: var(--gray); }
    .end-score span { color: var(--white); font-size: 1.5rem; }
    .end-emoji { font-size: 3rem; }
    .restart-btn {
      padding: 0.9rem 2rem; border-radius: 4px;
      background: var(--white); color: var(--black);
      border: none; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 800; letter-spacing: 0.06em;
      cursor: pointer; transition: background 0.15s, transform 0.15s;
    }
    .restart-btn:hover { background: #ddd9d1; transform: translateY(-2px); }

    /* FOOTER */
    footer { padding: 1.25rem 2rem; border-top: 0.5px solid var(--border); text-align: center; }
    footer p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray); }
    footer a { color: var(--gray); text-decoration: none; }
    footer a:hover { color: var(--white); }

    @media (max-width: 480px) {
      nav { padding: 1rem 1.25rem; }
      .scorebar { gap: 1.25rem; }
    }

    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <span class="li">Linked</span>In <span style="color:rgba(255,255,255,0.25)">ou</span> <span class="int">Inter</span>pol
    </a>
    <a href="jouer.html" class="nav-back">← Retour</a>
  </nav>

  <!-- BARRE DE SCORE -->
  <div class="scorebar">
    <div class="score-item correct">
      <span class="score-val" id="sc-correct">0</span>
      <span class="score-lbl">Réussis</span>
    </div>
    <div class="score-sep"></div>
    <div class="score-item incorrect">
      <span class="score-val" id="sc-incorrect">0</span>
      <span class="score-lbl">Ratés</span>
    </div>
    <div class="score-sep"></div>
    <div class="score-item total">
      <span class="score-val" id="sc-total">0 <span style="font-size:13px; color:var(--gray)" id="sc-pct">(—)</span></span>
      <span class="score-lbl">Total</span>
    </div>
  </div>

  <main>

    <!-- JEU -->
    <div id="game-area" style="display:flex; flex-direction:column; align-items:center; gap:1.5rem; width:100%;">

      <div class="question-counter" id="question-counter">Question 1 / 10</div>

      <!-- CARTE PHOTO -->
      <div class="photo-card" id="photo-card">
        <div class="photo-frame">
          <!-- L'image sera ici. Pour l'instant : placeholder -->
          <div class="photo-placeholder" id="photo-placeholder">
            <div class="icon">🖼️</div>
            <p>Photo à venir</p>
          </div>
          <!-- <img id="photo-img" src="" alt="Profil" style="display:none"> -->
        </div>

        <!-- OVERLAY RÉSULTAT (caché jusqu'au vote) -->
        <div class="result-overlay" id="result-overlay">
          <div class="result-verdict" id="result-verdict"></div>
          <div class="result-name" id="result-name"></div>
          <p class="result-desc" id="result-desc"></p>
          <a href="#" class="result-link" id="result-link" target="_blank" rel="noopener noreferrer">
            <span id="result-link-text">Voir le profil</span>
            <span class="ext">↗</span>
          </a>
        </div>
      </div>

      <!-- BOUTONS VOTE -->
      <div class="vote-buttons" id="vote-buttons">
        <button class="vote-btn linkedin" id="btn-linkedin" onclick="vote('linkedin')">
          <span class="btn-icon">💼</span>
          LinkedIn
        </button>
        <button class="vote-btn interpol" id="btn-interpol" onclick="vote('interpol')">
          <span class="btn-icon">🚨</span>
          Interpol
        </button>
      </div>

      <!-- BOUTON SUIVANT -->
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">
        Question suivante →
      </button>

    </div>

    <!-- ÉCRAN DE FIN -->
    <div class="end-screen" id="end-screen">
      <div class="end-emoji" id="end-emoji">🏆</div>
      <div class="end-title" id="end-title">Partie terminée !</div>
      <div class="end-score">
        Score final : <span id="end-score-val">—</span>
      </div>
      <button class="restart-btn" onclick="restartGame()">Rejouer →</button>
      <a href="jouer.html" style="font-size:13px; color:var(--gray); text-decoration:none;">← Changer de mode</a>
    </div>

  </main>

  <footer>
    <p>© 2025 LinkedIn ou Interpol ? &nbsp;·&nbsp; <a href="confidentialite.html">Confidentialité</a></p>
  </footer>

<script>
  // ============================================================
  // DONNÉES DU JEU
  // Pour ajouter une fiche : copier un objet du tableau,
  // remplir : type, name, photo (chemin), desc, url
  // ============================================================
  const FICHES = [
    {
      type: "linkedin",           // "linkedin" ou "interpol"
      name: "Marie Dupont",
      photo: "",                  // ex: "photos/marie-dupont.jpg"
      desc: "Directrice Marketing chez TechCorp France. Spécialisée en stratégie digitale et growth hacking depuis 12 ans.",
      url: "https://linkedin.com" // URL du profil LinkedIn
    },
    {
      type: "interpol",
      name: "Carlos V.",
      photo: "",
      desc: "Recherché pour fraude internationale et blanchiment d'argent dans 7 pays européens. Notice rouge émise en 2022.",
      url: "https://www.interpol.int/fr/Infractions/Notices-INTERPOL/Notices-rouges"
    },
    {
      type: "linkedin",
      name: "Thomas Bernard",
      photo: "",
      desc: "Développeur Full-Stack senior chez Startup.io. Passionné par React, Node.js et l'open source.",
      url: "https://linkedin.com"
    },
    {
      type: "interpol",
      name: "Ahmed K.",
      photo: "",
      desc: "Membre présumé d'un réseau de cybercriminalité spécialisé dans les attaques par ransomware. Recherché depuis 2021.",
      url: "https://www.interpol.int/fr/Infractions/Notices-INTERPOL/Notices-rouges"
    },
    {
      type: "linkedin",
      name: "Sophie Martin",
      photo: "",
      desc: "Avocate spécialisée en droit des affaires au cabinet Lefebvre & Associés. Diplômée de Paris I Panthéon-Sorbonne.",
      url: "https://linkedin.com"
    },
    {
      type: "interpol",
      name: "Ivan P.",
      photo: "",
      desc: "Trafiquant d'armes présumé, opérant sous plusieurs fausses identités à travers l'Europe de l'Est. En fuite depuis 2019.",
      url: "https://www.interpol.int/fr/Infractions/Notices-INTERPOL/Notices-rouges"
    },
    {
      type: "linkedin",
      name: "Léa Fontaine",
      photo: "",
      desc: "UX Designer freelance. A collaboré avec Airbnb, BlaBlaCar et Doctolib. Conférencière à Paris Design Week.",
      url: "https://linkedin.com"
    },
    {
      type: "interpol",
      name: "Marco S.",
      photo: "",
      desc: "Recherché pour escroquerie à grande échelle et usurpation d'identité. A escroqué plus de 300 victimes en Europe.",
      url: "https://www.interpol.int/fr/Infractions/Notices-INTERPOL/Notices-rouges"
    },
    {
      type: "linkedin",
      name: "Antoine Morel",
      photo: "",
      desc: "CEO de GreenTech Solutions, startup spécialisée dans les énergies renouvelables. Levée de fonds Series A de 5M€ en 2024.",
      url: "https://linkedin.com"
    },
    {
      type: "interpol",
      name: "Dmitri V.",
      photo: "",
      desc: "Suspect principal dans une affaire de trafic de stupéfiants à l'échelle internationale. Lié à un cartel d'Amérique du Sud.",
      url: "https://www.interpol.int/fr/Infractions/Notices-INTERPOL/Notices-rouges"
    }
  ];

  // ============================================================
  // LOGIQUE DU JEU
  // ============================================================
  let questions = [];
  let currentIndex = 0;
  let correct = 0;
  let incorrect = 0;
  let answered = false;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    questions = shuffle(FICHES);
    currentIndex = 0;
    correct = 0;
    incorrect = 0;
    answered = false;
    updateScore();
    document.getElementById('end-screen').classList.remove('show');
    document.getElementById('game-area').style.display = 'flex';
    loadQuestion();
  }

  function loadQuestion() {
    answered = false;
    const q = questions[currentIndex];

    // Counter
    document.getElementById('question-counter').textContent =
      `Question ${currentIndex + 1} / ${questions.length}`;

    // Photo
    // Si une photo est définie on l'affiche, sinon placeholder
    const placeholder = document.getElementById('photo-placeholder');
    // const img = document.getElementById('photo-img');
    if (q.photo) {
      placeholder.style.display = 'none';
      // img.src = q.photo; img.style.display = 'block';
    } else {
      placeholder.style.display = 'flex';
      // img.style.display = 'none';
    }

    // Reset carte
    const card = document.getElementById('photo-card');
    card.className = 'photo-card';

    // Masquer overlay et next
    document.getElementById('result-overlay').classList.remove('show');
    document.getElementById('next-btn').classList.remove('show');

    // Réactiver boutons
    document.getElementById('btn-linkedin').disabled = false;
    document.getElementById('btn-interpol').disabled = false;
  }

  function vote(choice) {
    if (answered) return;
    answered = true;

    const q = questions[currentIndex];
    const isCorrect = choice === q.type;

    // Score
    if (isCorrect) correct++; else incorrect++;
    updateScore();

    // Désactiver boutons
    document.getElementById('btn-linkedin').disabled = true;
    document.getElementById('btn-interpol').disabled = true;

    // Couleur carte
    const card = document.getElementById('photo-card');
    if (isCorrect) {
      card.classList.add('reveal-correct');
    } else {
      card.classList.add(q.type === 'linkedin' ? 'reveal-linkedin' : 'reveal-interpol');
    }

    // Overlay résultat
    const overlay = document.getElementById('result-overlay');
    const verdict = document.getElementById('result-verdict');
    const name = document.getElementById('result-name');
    const desc = document.getElementById('result-desc');
    const link = document.getElementById('result-link');
    const linkText = document.getElementById('result-link-text');

    verdict.textContent = isCorrect ? '✓ Correct !' : '✗ Incorrect';
    verdict.className = 'result-verdict ' + (isCorrect ? 'correct' : 'incorrect');

    name.textContent = q.name;
    name.className = 'result-name ' + q.type;

    desc.textContent = q.desc;

    link.href = q.url;
    link.className = 'result-link ' + q.type;
    linkText.textContent = q.type === 'linkedin' ? 'Voir le profil LinkedIn' : 'Voir la notice Interpol';

    overlay.classList.add('show');

    // Bouton suivant
    const nextBtn = document.getElementById('next-btn');
    if (currentIndex < questions.length - 1) {
      nextBtn.textContent = 'Question suivante →';
    } else {
      nextBtn.textContent = 'Voir mon score →';
    }
    nextBtn.classList.add('show');
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex >= questions.length) {
      showEndScreen();
    } else {
      loadQuestion();
    }
  }

  function showEndScreen() {
    document.getElementById('game-area').style.display = 'none';
    const end = document.getElementById('end-screen');
    end.classList.add('show');

    const total = correct + incorrect;
    const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

    document.getElementById('end-score-val').textContent =
      `${correct} / ${total} (${pct}%)`;

    let emoji = '😅';
    let title = 'Pas mal…';
    if (pct >= 90) { emoji = '🏆'; title = 'Détective en chef !'; }
    else if (pct >= 70) { emoji = '🎯'; title = 'Beau sang-froid.'; }
    else if (pct >= 50) { emoji = '🤔'; title = 'Peut mieux faire.'; }
    else { emoji = '😬'; title = 'Tu embaucherais n\'importe qui.'; }

    document.getElementById('end-emoji').textContent = emoji;
    document.getElementById('end-title').textContent = title;
  }

  function updateScore() {
    const total = correct + incorrect;
    const pct = total > 0 ? Math.round((correct / total) * 100) : null;
    document.getElementById('sc-correct').textContent = correct;
    document.getElementById('sc-incorrect').textContent = incorrect;
    document.getElementById('sc-total').innerHTML =
      `${total} <span style="font-size:13px; color:var(--gray)" id="sc-pct">${pct !== null ? '(' + pct + '%)' : '(—)'}</span>`;
  }

  function restartGame() {
    startGame();
  }

  // Lancement
  startGame();
</script>
</body>
</html>

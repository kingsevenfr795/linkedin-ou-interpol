<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn ou Interpol ?</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --blue: #0a66c2;
            --red: #e63329;
            --white: #f5f2eb;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background: var(--black);
            color: var(--white);
            font-family: 'Syne', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* Score en haut */
        #ui-top {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }
        .score-box {
            font-family: 'DM Mono', monospace;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        /* Zone Image */
        #game-container {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        #person-image {
            max-height: 70vh; max-width: 90vw;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Boutons type Openfront */
        #controls {
            display: flex; height: 25vh;
        }
        .btn {
            flex: 1; border: none; cursor: pointer;
            font-family: 'Syne', sans-serif; font-weight: 800;
            font-size: clamp(1.5rem, 5vw, 3rem);
            text-transform: uppercase; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-li { background: var(--blue); color: white; }
        .btn-int { background: var(--red); color: white; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); z-index: 2; }

        /* Feedback Flash */
        #flash {
            position: absolute; inset: 0; 
            pointer-events: none; opacity: 0; z-index: 5;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div id="flash"></div>

    <div id="ui-top">
        <div class="score-box">SCORE: <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <img id="person-image" src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=800" alt="Suspect or CEO">
    </div>

    <div id="controls">
        <button class="btn btn-li" onclick="check('linkedin')">LinkedIn</button>
        <button class="btn btn-int" onclick="check('interpol')">Interpol</button>
    </div>

    <script>
        let score = 0;
        
        // Liste d'exemples (Il faudra mettre tes vraies images ici plus tard)
        const database = [
            { url: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800", type: "linkedin" },
            { url: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800", type: "interpol" },
            { url: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=800", type: "linkedin" }
        ];

        function check(choice) {
            const flash = document.getElementById('flash');
            const scoreEl = document.getElementById('score');
            
            // Logique simplifiée pour l'exemple (on prend un type au hasard)
            const isCorrect = Math.random() > 0.5; 

            if(isCorrect) {
                score++;
                flash.style.background = "#22c55e";
            } else {
                score = 0;
                flash.style.background = "#ef4444";
            }

            // Animation
            scoreEl.innerText = score;
            flash.style.opacity = "0.3";
            setTimeout(() => { flash.style.opacity = "0"; }, 300);
            
            // Changer d'image (aléatoire)
            const next = database[Math.floor(Math.random() * database.length)];
            document.getElementById('person-image').src = next.url;
        }
    </script>
</body>
</html>

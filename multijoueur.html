<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multijoueur — LinkedIn ou Interpol ?</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #0a0a0a; --white: #f5f2eb; --red: #e63329;
      --blue: #0a66c2; --gray: #b0aa9e; --card-bg: #131310;
      --border: rgba(255,255,255,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: 'Syne', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 2.5rem; border-bottom: 0.5px solid var(--border); background: rgba(10,10,10,0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; }
    .nav-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: var(--white); }
    .nav-logo span.li { color: var(--blue); }
    .nav-logo span.int { color: var(--red); }
    .nav-back { font-size: 12px; color: var(--gray); text-decoration: none; transition: color 0.2s; }
    .nav-back:hover { color: var(--white); }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1.5rem; gap: 2rem; }

    .page-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); animation: fadeUp 0.4s ease both; }
    .page-title { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 800; letter-spacing: -0.02em; text-align: center; animation: fadeUp 0.4s 0.08s ease both; }

    .pseudo-block {
      width: 100%; max-width: 420px; background: var(--card-bg);
      border: 0.5px solid var(--border); border-radius: 8px;
      padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;
      animation: fadeUp 0.4s 0.12s ease both;
    }
    .pseudo-block label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); }
    .pseudo-input {
      width: 100%; background: #1a1a17; border: 0.5px solid var(--border);
      border-radius: 4px; padding: 0.75rem 1rem;
      color: var(--white); font-family: 'Syne', sans-serif; font-size: 15px;
      outline: none; transition: border-color 0.2s;
    }
    .pseudo-input:focus { border-color: rgba(255,255,255,0.25); }
    .pseudo-input.error { border-color: var(--red); }
    .pseudo-input::placeholder { color: var(--gray); opacity: 0.4; }
    .pseudo-error { font-size: 12px; color: var(--red); display: none; }
    .pseudo-error.show { display: block; }

    .actions { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1rem; animation: fadeUp 0.4s 0.2s ease both; }

    .btn-create {
      width: 100%; padding: 1.1rem; border-radius: 4px;
      background: var(--white); color: var(--black); border: none;
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800;
      letter-spacing: 0.04em; cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .btn-create:hover { background: #ddd9d1; transform: translateY(-2px); }

    .divider { display: flex; align-items: center; gap: 1rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }
    .divider span { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray); letter-spacing: 0.1em; text-transform: uppercase; }

    .join-block { display: flex; gap: 0.75rem; }
    .code-input {
      flex: 1; background: #1a1a17; border: 0.5px solid var(--border);
      border-radius: 4px; padding: 0.75rem 1rem;
      color: var(--white); font-family: 'DM Mono', monospace; font-size: 20px;
      letter-spacing: 0.25em; text-align: center; text-transform: uppercase;
      outline: none; transition: border-color 0.2s;
    }
    .code-input:focus { border-color: rgba(255,255,255,0.25); }
    .code-input::placeholder { font-size: 13px; letter-spacing: 0.1em; color: var(--gray); opacity: 0.4; }
    .btn-join {
      padding: 0.75rem 1.5rem; border-radius: 4px;
      background: transparent; color: var(--white);
      border: 0.5px solid var(--border);
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .btn-join:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); }

    .error-msg { font-size: 12px; color: var(--red); text-align: center; display: none; }
    .error-msg.show { display: block; }

    footer { padding: 1.25rem 2rem; border-top: 0.5px solid var(--border); text-align: center; }
    footer p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray); }
    footer a { color: var(--gray); text-decoration: none; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <span class="li">Linked</span>In <span style="color:rgba(255,255,255,0.3)">ou</span> <span class="int">Inter</span>pol
    </a>
    <a href="jouer.html" class="nav-back">← Retour</a>
  </nav>

  <main>
    <div class="page-label">Mode Multijoueur</div>
    <h1 class="page-title">Créer ou rejoindre<br>une salle</h1>

    <div class="pseudo-block">
      <label for="pseudo-input">Votre pseudo *</label>
      <input type="text" class="pseudo-input" id="pseudo-input"
             placeholder="Entrez votre pseudo..." maxlength="20" />
      <div class="pseudo-error" id="pseudo-error">Veuillez renseigner un pseudo pour continuer.</div>
    </div>

    <div class="actions">
      <button class="btn-create" onclick="creerSalle()">🎮 Créer une salle</button>
      <div class="divider"><span>ou</span></div>
      <div class="join-block">
        <input type="text" class="code-input" id="code-input"
               placeholder="CODE" maxlength="6"
               oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" />
        <button class="btn-join" onclick="rejoindre()">Rejoindre →</button>
      </div>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </main>

  <footer>
    <p>© 2026 LinkedIn ou Interpol ? &nbsp;·&nbsp; <a href="index.html#confidentialite">Confidentialité</a></p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDxgCs96QGGHVhAnAufoOfhUVpD6OteRDU",
      authDomain: "linkedin-ou-interpol.firebaseapp.com",
      databaseURL: "https://linkedin-ou-interpol-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "linkedin-ou-interpol",
      storageBucket: "linkedin-ou-interpol.firebasestorage.app",
      messagingSenderId: "282791773827",
      appId: "1:282791773827:web:e2bdc60c208dda87737db6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getPseudo() {
      const input = document.getElementById('pseudo-input').value.trim();
      return input;
    }

    function validerPseudo() {
      const pseudo = getPseudo();
      const errorEl = document.getElementById('pseudo-error');
      const inputEl = document.getElementById('pseudo-input');
      if (!pseudo) {
        errorEl.classList.add('show');
        inputEl.classList.add('error');
        return null;
      }
      errorEl.classList.remove('show');
      inputEl.classList.remove('error');
      return pseudo;
    }

    function genCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    async function creerSalle() {
      const pseudo = validerPseudo();
      if (!pseudo) return;

      const playerId = 'player_' + Date.now();
      const code = genCode();

      sessionStorage.setItem('playerId', playerId);
      sessionStorage.setItem('playerName', pseudo);
      sessionStorage.setItem('roomCode', code);
      sessionStorage.setItem('isHost', 'true');

      await db.ref(`rooms/${code}`).set({
        host: playerId,
        status: 'waiting',
        createdAt: Date.now(),
        params: { questions: 10, timer: 10, elimination: false, showScores: true },
        players: {
          [playerId]: { name: pseudo, score: 0, eliminated: false, joinedAt: Date.now() }
        }
      });

      window.location.href = `salle.html?code=${code}`;
    }

    async function rejoindre() {
      const pseudo = validerPseudo();
      if (!pseudo) return;

      const code = document.getElementById('code-input').value.trim().toUpperCase();
      const errEl = document.getElementById('error-msg');

      if (code.length !== 6) {
        errEl.textContent = 'Le code doit faire 6 caractères.';
        errEl.classList.add('show');
        return;
      }

      const snap = await db.ref(`rooms/${code}`).once('value');
      if (!snap.exists()) {
        errEl.textContent = 'Salle introuvable. Vérifie le code.';
        errEl.classList.add('show');
        return;
      }

      const room = snap.val();
      if (room.status !== 'waiting') {
        errEl.textContent = 'La partie a déjà commencé.';
        errEl.classList.add('show');
        return;
      }

      const nbPlayers = Object.keys(room.players || {}).length;
      if (nbPlayers >= 8) {
        errEl.textContent = 'La salle est pleine (8 joueurs max).';
        errEl.classList.add('show');
        return;
      }

      errEl.classList.remove('show');
      const playerId = 'player_' + Date.now();
      sessionStorage.setItem('playerId', playerId);
      sessionStorage.setItem('playerName', pseudo);
      sessionStorage.setItem('roomCode', code);
      sessionStorage.setItem('isHost', 'false');

      await db.ref(`rooms/${code}/players/${playerId}`).set({
        name: pseudo, score: 0, eliminated: false, joinedAt: Date.now()
      });

      window.location.href = `salle.html?code=${code}`;
    }
  </script>
</body>
</html>
